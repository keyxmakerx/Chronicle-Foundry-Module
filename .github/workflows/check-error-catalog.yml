name: Check Error Catalog

# API-CONTRACT.md copies Chronicle's error-catalog.json into a table, and
# update-info.mjs keeps its own copy of the category set. This fetches the
# catalog from Chronicle's main branch and fails when either copy has fallen
# behind. Chronicle changes don't trigger this repo's CI, so it also runs
# weekly. Separate from check-descriptor.yml because it needs the network.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check-error-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Compare error-code table with Chronicle's catalog
        run: node tools/check-error-catalog.mjs
