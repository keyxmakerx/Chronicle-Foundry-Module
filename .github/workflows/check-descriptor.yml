name: Check Package Descriptor

# Validates chronicle-package.json against module.json on every push to
# main and every PR. Guards against the two files drifting (e.g., a
# version bump in module.json without a corresponding update in the
# descriptor, an id rename, an endpoint placeholder typo).
#
# Intentionally a separate workflow from release.yml — descriptor
# validation should run on PRs (where the release workflow's tag-push
# trigger doesn't fire) so misconfigurations are caught before merge.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Validate chronicle-package.json
        run: node tools/check-package-descriptor.mjs

      # Full off-DOM test suite (B-R8). The glob is quoted so the shell passes
      # it to Node literally — Node's own glob matches each tools/test-*.mjs file
      # (the bare directory form `node --test tools/` errors on Node 20). This
      # supersedes the old single-file test-update-info step.
      - name: Run test suite
        run: node --test 'tools/test-*.mjs'
