name: Check Package Descriptor

# Validates chronicle-package.json against module.json on every push to
# main and every PR. Guards against the two files drifting (e.g., a
# version bump in module.json without a corresponding update in the
# descriptor, an id rename, an endpoint placeholder typo).
#
# Intentionally a separate workflow from release.yml — descriptor
# validation should run on PRs (where the release workflow's tag-push
# trigger doesn't fire) so misconfigurations are caught before merge.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate chronicle-package.json
        run: node tools/check-package-descriptor.mjs

      # Full off-DOM test suite (B-R8). The glob is UNQUOTED so the bash shell
      # expands tools/test-*.mjs to explicit file args — Node's own glob for
      # --test only landed in Node 21+, and this workflow pins Node 20, so a
      # quoted glob reaches Node literally and "cannot be found". The bare
      # directory form (`node --test tools/`) also errors on Node 20. Shell
      # expansion works on every Node version. This supersedes the old
      # single-file test-update-info step.
      - name: Run test suite
        run: node --test tools/test-*.mjs
