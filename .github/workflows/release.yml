# Module releases moved to Chronicle (FM-CSU).
# Admins upload module .zip builds via /admin/modules/foundry on the
# Chronicle instance; campaign owners pin a version per-campaign and
# Foundry pulls updates from the per-campaign signed manifest URL.
#
# This workflow remains for emergency manual dispatches only — the
# tag-push trigger is intentionally commented out to stop automatic
# GitHub releases. To produce an ad-hoc artifact, use the
# `workflow_dispatch` button in the Actions tab.
name: Release Module

on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in module.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Update download URL in module.json
        run: |
          jq --arg tag "${{ github.ref_name }}" \
            '.download = "https://github.com/${{ github.repository }}/releases/download/" + $tag + "/chronicle-sync.zip"' \
            module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build release zip
        run: |
          zip -r chronicle-sync.zip \
            module.json \
            chronicle-package.json \
            scripts/ \
            styles/ \
            templates/ \
            lang/ \
            LICENSE \
            README.md \
            -x "*.git*" "*.DS_Store" "*.ai.md" "CLAUDE.md" "TESTING.md" \
                "API.md" "CONSTANTS.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            chronicle-sync.zip
            module.json
          generate_release_notes: true
