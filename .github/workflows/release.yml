name: Release

# Publishes a module release from main in one step: the same tag and GitHub
# release a maintainer would draft by hand, with generated notes.
#
# Usage: Actions tab -> "Release" -> "Run workflow" -> enter the version
# (e.g. 0.1.30, no leading "v"). Chronicle's packages plugin picks it up on
# "Check for updates" in Admin -> Packages.
#
# Nothing is attached, on purpose: Chronicle installs the release's source zip
# and writes the tag into module.json at install time, so module.json's
# version on main is never read.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, no leading "v" (e.g. 0.1.30)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The version is read from an env var, never interpolated into the
      # script, so a crafted input can't inject shell.
      - name: Validate version (X.Y.Z, no leading v)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z with no leading 'v' (got '$VERSION')"; exit 1; }

      - name: Create tag and GitHub release from main
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: main
          generate_release_notes: true
          make_latest: 'true'
