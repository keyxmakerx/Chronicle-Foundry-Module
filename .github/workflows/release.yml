# This workflow is NOT the release path.
#
# A release is a GitHub release on this repo: Releases -> Draft a new release,
# tag it (e.g. 0.1.30), "Generate release notes", Publish. Chronicle's packages
# plugin imports releases from here ("Check for updates" in Admin -> Packages),
# falling back to GitHub's source zip when a release has no attached asset.
# Campaign owners then pin a version per campaign, and Foundry pulls updates
# from the per-campaign signed manifest URL.
#
# This workflow remains for emergency manual dispatches only; the tag-push
# trigger is intentionally commented out. It takes the version from the ref it
# runs on, so dispatch it on a tag ("Use workflow from" -> Tags), never on main,
# or the version comes out as "main". Fixing or retiring it is tracked in #89.
name: Release Module

on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in module.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Update download URL in module.json
        run: |
          jq --arg tag "${{ github.ref_name }}" \
            '.download = "https://github.com/${{ github.repository }}/releases/download/" + $tag + "/chronicle-sync.zip"' \
            module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build release zip
        run: |
          zip -r chronicle-sync.zip \
            module.json \
            chronicle-package.json \
            scripts/ \
            styles/ \
            templates/ \
            lang/ \
            LICENSE \
            README.md \
            -x "*.git*" "*.DS_Store" "*.ai.md" "CLAUDE.md" "TESTING.md" \
                "API.md" "CONSTANTS.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            chronicle-sync.zip
            module.json
          generate_release_notes: true
